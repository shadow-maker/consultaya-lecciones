[project]
name = "consultaya-lecciones"
version = "0.1.0"
description = "ConsultaYa · microservicio de lecciones"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings",
    "pyjwt",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # El JWT_SECRET de desarrollo es corto a propósito; en AWS son 64+ caracteres.
    "ignore:The HMAC key is:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
